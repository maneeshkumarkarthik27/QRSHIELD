services:
  qrshield-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: qrshield-sandbox:local
    container_name: qrshield-sandbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:4892:4892"
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
